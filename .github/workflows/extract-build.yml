name: Build UpNetwork CPA APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q UpNetwork-CPA-Android-Complete.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/UpNetwork-CPA-Android
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UpNetwork-CPA-Android-APK
          path: extracted/UpNetwork-CPA-Android/app/build/outputs/apk/debug/app-debug.apk
